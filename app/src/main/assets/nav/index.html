<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Haritalar</title>
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>

    <!-- Üstte arama çubuğu -->
    <div id="searchBar" class="panel">
        <div class="search-row">
            <input id="searchInput" type="text" inputmode="search"
                   placeholder="Nereye gidilsin? (adres, yer)" autocomplete="off" />
            <button id="searchBtn" aria-label="Ara">🔍</button>
        </div>
        <ul id="results" class="results hidden"></ul>
    </div>

    <!-- Sağ alt kontrol tuşları -->
    <button id="recenterBtn" class="fab" title="Konumuma dön">◎</button>

    <!-- Navigasyon üst banner'ı -->
    <div id="navBanner" class="nav-banner hidden">
        <div class="maneuver" id="maneuverIcon">↑</div>
        <div class="nav-texts">
            <div id="navDistance" class="nav-distance">—</div>
            <div id="navInstruction" class="nav-instruction">Yol hesaplanıyor…</div>
        </div>
    </div>

    <!-- Alt bilgi/aksiyon paneli -->
    <div id="bottomSheet" class="bottom-sheet hidden">
        <div class="trip-summary">
            <div><span id="tripEta" class="big">—</span><small>varış</small></div>
            <div><span id="tripDist" class="big">—</span><small>mesafe</small></div>
            <div id="tripDest" class="dest-label">Hedef</div>
        </div>
        <div class="actions">
            <button id="startBtn" class="btn primary">Başlat</button>
            <button id="stopBtn" class="btn danger hidden">Durdur</button>
            <button id="clearBtn" class="btn ghost">İptal</button>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="vendor/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
