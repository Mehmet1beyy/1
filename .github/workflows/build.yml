name: Build IVD (yayınlı)

# Independent Virtual Display + WiFi yayını APK'sını derler.
# Çıktı: Actions çalışması → Artifacts → IVD-APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IVD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          dotnet publish desktop/MapCastViewer/MapCastViewer.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o publish
          Get-ChildItem publish\MapCastViewer.exe

      - name: Upload EXE (klasör)
        uses: actions/upload-artifact@v4
        with:
          name: MapCastViewer-win-x64
          path: publish/**
          retention-days: 30
